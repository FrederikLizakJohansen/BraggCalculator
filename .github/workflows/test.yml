name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all]" matplotlib pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
      - run: python scripts/validate_against_pymatgen.py
      - run: python benchmarks/benchmark_against_pymatgen.py --number 5 --repeat 3 --require-speedup 1
